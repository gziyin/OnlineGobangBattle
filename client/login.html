<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线五子棋 - 登录</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="ink-scene" aria-hidden="true">
        <svg class="ink-scene__taiji" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="taijiGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#f5f0e8" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="#f5f0e8" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="98" fill="url(#taijiGlow)"/>
            <circle cx="100" cy="100" r="90" fill="#f5f0e8" opacity="0.06"/>
            <path d="M100 10 A90 90 0 1 1 100 190 A45 45 0 1 0 100 100 A45 45 0 1 1 100 10 Z" fill="#f5f0e8" opacity="0.12"/>
            <circle cx="100" cy="55" r="10" fill="#1a1814" opacity="0.5"/>
            <circle cx="100" cy="145" r="10" fill="#f5f0e8" opacity="0.35"/>
        </svg>
        <svg class="ink-scene__mountains" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3d3830" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#1a1814" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#6b6358" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#1a1814" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path d="M0,320 L0,200 Q180,120 360,170 Q540,80 720,150 Q900,60 1080,130 Q1260,90 1440,160 L1440,320 Z" fill="url(#mountainFar)"/>
            <path d="M0,320 L0,240 Q240,180 480,220 Q720,140 960,200 Q1200,160 1440,230 L1440,320 Z" fill="url(#mountainNear)"/>
        </svg>
        <svg class="ink-scene__brush" viewBox="0 0 600 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,50 Q80,10 200,40 Q320,70 420,25 Q520,5 600,35 L600,80 L0,80 Z" fill="#f5f0e8" opacity="0.04"/>
        </svg>
        <p class="ink-scene__verse">道生一，一生二，二生三，三生万物</p>
    </div>

    <main class="login-page">
        <article class="scroll">
            <div class="scroll__roller scroll__roller--top" aria-hidden="true">
                <span class="scroll__knob"></span>
                <span class="scroll__bar"></span>
                <span class="scroll__knob"></span>
            </div>
            <div class="scroll__body">
                <div class="scroll__content">
            <header class="login-brand">
                <div class="login-brand__emblem">
                    <svg class="login-brand__taiji" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
                        <path d="M32 2 A30 30 0 1 1 32 62 A15 15 0 1 0 32 32 A15 15 0 1 1 32 2 Z" fill="currentColor"/>
                        <circle cx="32" cy="17" r="4" fill="#faf7f2"/>
                        <circle cx="32" cy="47" r="4" fill="currentColor"/>
                    </svg>
                    <div class="dao-seal"><span>弈</span></div>
                </div>
                <h1>在线五子棋</h1>
                <p class="login-brand__tagline">知白守黑 · 道法自然</p>
                <p class="login-brand__sub">水墨对弈，即时匹配</p>
            </header>
            <form id="authForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-login">入 弈</button>
                    <button type="button" class="btn btn-register" id="registerBtn">注 册</button>
                </div>
            </form>
            <footer class="scroll__footer" aria-hidden="true">
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
                <span class="bagua-dot"></span>
            </footer>
                </div>
            </div>
            <div class="scroll__roller scroll__roller--bottom" aria-hidden="true">
                <span class="scroll__knob"></span>
                <span class="scroll__bar"></span>
                <span class="scroll__knob"></span>
            </div>
        </article>
        <p class="login-page__vertical" aria-hidden="true">玄</p>
    </main>
    <div class="notification" id="notification" role="status" aria-live="polite"></div>

    <script src="js/websocket.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api/v1/auth';

        function showNotification(msg, type = 'info') {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.className = `notification ${type} show`;
            setTimeout(() => n.classList.remove('show'), 3000);
        }

        async function authRequest(endpoint, username, password) {
            const resp = await fetch(`${API_BASE}/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            return await resp.json();
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            if (!username || !password) {
                errorMsg.textContent = '请填写用户名和密码';
                return;
            }

            try {
                const result = await authRequest('login', username, password);
                if (result.success) {
                    sessionStorage.setItem('gobang_token', result.token);
                    sessionStorage.setItem('gobang_user', JSON.stringify({
                        id: result.user.id,
                        username: result.user.username,
                        score: result.user.score || 1000
                    }));
                    showNotification('登录成功！', 'success');
                    setTimeout(() => window.location.href = 'hall.html', 1000);
                } else {
                    errorMsg.textContent = result.message || '登录失败';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            if (!username || !password) {
                errorMsg.textContent = '请填写用户名和密码';
                return;
            }

            try {
                const result = await authRequest('register', username, password);
                if (result.success) {
                    showNotification('注册成功！请登录', 'success');
                } else {
                    errorMsg.textContent = result.message || '注册失败';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线五子棋 - 游戏大厅</title>
    <link rel="stylesheet" href="css/hall.css">
</head>
<body>
    <div class="ambient-bg" aria-hidden="true"></div>
    <div class="ambient-bg__veil" aria-hidden="true"></div>

    <div class="story-wallpaper" id="storyWallpaper" aria-hidden="true"></div>
    <div class="story-wallpaper__ink-wash" aria-hidden="true"></div>

    <main class="hall-page">
        <div class="hall-container">
            <header class="hall-header card-surface">
                <div class="hall-header__user">
                    <div class="hall-avatar" aria-hidden="true">棋</div>
                    <div>
                        <div class="hall-username" id="username">加载中...</div>
                        <div class="hall-score" id="score">分数: --</div>
                    </div>
                </div>
                <div class="hall-header__actions">
                    <div class="realm-picker">
                        <button type="button" class="realm-picker__trigger" id="realmPickerTrigger" aria-expanded="false" aria-controls="realmPickerPanel">
                            <span class="realm-picker__trigger-label">五境 · 换壁纸</span>
                            <span class="realm-picker__chevron" aria-hidden="true">▼</span>
                        </button>
                        <div class="realm-picker__panel" id="realmPickerPanel" hidden>
                            <p class="realm-picker__title">五境修行 · 自选心境</p>
                            <div class="realm-picker__track" id="realmPickerTrack"></div>
                        </div>
                    </div>
                    <button type="button" class="btn-ghost" id="logoutBtn">退出登录</button>
                </div>
            </header>

            <section class="hall-main card-surface">
                <h1 class="hall-main__title">弈局大厅</h1>
                <div class="hall-status">
                    <span class="status-pill status-pill--idle" id="statusPill">空闲</span>
                    <span class="status-icon" id="statusIcon" aria-hidden="true">🎯</span>
                    <p class="status-text" id="statusText">空闲中</p>
                </div>

                <div class="match-panel">
                    <button type="button" class="btn-primary" id="matchStartBtn">开始匹配</button>
                    <button type="button" class="btn-ghost is-disabled" id="matchCancelBtn" disabled>取消匹配</button>
                </div>

                <div class="waiting-info" id="waitingInfo" hidden>
                    等待时间: <span class="time" id="waitTime">0</span> 秒
                </div>
            </section>
        </div>
    </main>

    <div class="reconnect-modal hidden" id="reconnectModal">
        <div class="reconnect-content">
            <h2>发现未完成的游戏</h2>
            <div class="reconnect-info" id="reconnectInfo">对手正在等待你重连...</div>
            <div class="reconnect-countdown" id="reconnectCountdown">60</div>
            <div class="board-preview-container">
                <canvas id="boardPreview" width="300" height="300"></canvas>
            </div>
            <div class="reconnect-actions">
                <button type="button" class="btn-primary" id="btnReconnectAccept">重连进入</button>
                <button type="button" class="btn-ghost" id="btnReconnectReject">放弃认输</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification" role="status" aria-live="polite"></div>
    <div class="connection-status connecting" id="connectionStatus">正在连接...</div>

    <script src="js/websocket.js"></script>
    <script type="module">
        import { initWallpaperPicker } from './js/realm-wallpapers.js';
        window.initWallpaperPicker = initWallpaperPicker;
    </script>
    <script>
        const AppState = {
            IDLE: 'idle',
            MATCHING: 'matching',
            MATCHED: 'matched'
        };

        let currentState = AppState.IDLE;
        let waitStartTime = 0;
        let waitTimer = null;
        let token = null;
        let userId = null;
        let username = null;
        let score = 0;

        const elements = {
            username: document.getElementById('username'),
            score: document.getElementById('score'),
            statusIcon: document.getElementById('statusIcon'),
            statusText: document.getElementById('statusText'),
            statusPill: document.getElementById('statusPill'),
            matchStartBtn: document.getElementById('matchStartBtn'),
            matchCancelBtn: document.getElementById('matchCancelBtn'),
            waitingInfo: document.getElementById('waitingInfo'),
            waitTime: document.getElementById('waitTime'),
            notification: document.getElementById('notification'),
            connectionStatus: document.getElementById('connectionStatus'),
            logoutBtn: document.getElementById('logoutBtn')
        };

        function getTokenColor(varName, fallback) {
            const val = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
            return val || fallback;
        }

        function loadToken() {
            token = sessionStorage.getItem('gobang_token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }

            const userInfo = JSON.parse(sessionStorage.getItem('gobang_user') || '{}');
            userId = userInfo.id;
            username = userInfo.username;
            score = userInfo.score || 1000;

            elements.username.textContent = username || '用户';
            elements.score.textContent = `分数: ${score}`;
            return true;
        }

        function setMatchButtons(idle) {
            if (idle) {
                elements.matchStartBtn.disabled = false;
                elements.matchStartBtn.classList.remove('is-disabled');
                elements.matchCancelBtn.disabled = true;
                elements.matchCancelBtn.classList.add('is-disabled');
            } else if (currentState === AppState.MATCHING) {
                elements.matchStartBtn.disabled = true;
                elements.matchStartBtn.classList.add('is-disabled');
                elements.matchCancelBtn.disabled = false;
                elements.matchCancelBtn.classList.remove('is-disabled');
            } else {
                elements.matchStartBtn.disabled = true;
                elements.matchStartBtn.classList.add('is-disabled');
                elements.matchCancelBtn.disabled = true;
                elements.matchCancelBtn.classList.add('is-disabled');
            }
        }

        function updateUI(state) {
            currentState = state;

            switch (state) {
                case AppState.IDLE:
                    elements.statusIcon.textContent = 'idle';
                    elements.statusText.textContent = '空闲中';
                    elements.statusPill.textContent = '空闲';
                    elements.statusPill.className = 'status-pill status-pill--idle';
                    setMatchButtons(true);
                    elements.waitingInfo.hidden = true;
                    stopWaitTimer();
                    break;

                case AppState.MATCHING:
                    elements.statusIcon.textContent = 'matching';
                    elements.statusText.textContent = '正在匹配...';
                    elements.statusPill.textContent = '匹配中';
                    elements.statusPill.className = 'status-pill status-pill--matching';
                    setMatchButtons(false);
                    elements.waitingInfo.hidden = false;
                    startWaitTimer();
                    break;

                case AppState.MATCHED:
                    elements.statusIcon.textContent = 'matched';
                    elements.statusText.textContent = '匹配成功！';
                    elements.statusPill.textContent = '已匹配';
                    elements.statusPill.className = 'status-pill status-pill--matched';
                    setMatchButtons(false);
                    elements.waitingInfo.hidden = true;
                    stopWaitTimer();
                    break;
            }
        }

        function startWaitTimer() {
            waitStartTime = Date.now();
            waitTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - waitStartTime) / 1000);
                elements.waitTime.textContent = elapsed;
            }, 1000);
        }

        function stopWaitTimer() {
            if (waitTimer) {
                clearInterval(waitTimer);
                waitTimer = null;
            }
        }

        function showNotification(message, type = 'info') {
            elements.notification.textContent = message;
            elements.notification.className = `notification ${type} show`;

            setTimeout(() => {
                elements.notification.classList.remove('show');
            }, 3000);
        }

        const eventHandlers = {
            'match.waiting': () => {
                if (currentState !== AppState.MATCHING) {
                    updateUI(AppState.MATCHING);
                }
                showNotification('已进入匹配队列', 'success');
            },

            'match.success': (data) => {
                updateUI(AppState.MATCHED);
                showNotification(`匹配成功！房间号: ${data.room_id}`, 'success');

                setTimeout(() => {
                    window.location.href = `room.html?room_id=${data.room_id}&color=${data.color}`;
                }, 2000);
            },

            'match.cancelled': () => {
                updateUI(AppState.IDLE);
                showNotification('已取消匹配', 'info');
            },

            'error': (data) => {
                showNotification(`错误: ${data.message}`, 'error');

                if (data.code === 4001) {
                    sessionStorage.removeItem('gobang_token');
                    sessionStorage.removeItem('gobang_user');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else if (data.code === 4009) {
                    shouldReconnect = false;
                    showNotification('该账号已登录', 'error');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else if (data.code === 4003 || data.code === 4004 || data.code === 4005) {
                    updateUI(AppState.IDLE);
                }
            },

            'pong': () => {},

            'auth.success': (data) => {
                userId = data.user_id;
                updateConnectionStatus('connected');
            },

            'reconnect.available': (data) => {
                showReconnectModal(data);
            },

            'reconnect.accepted': (data) => {
                hideReconnectModal();
                window.location.href = `room.html?room_id=${data.room_id}&color=${data.color}`;
            },

            'game.over': (data) => {
                hideReconnectModal();

                const delta = data.score_change || 0;
                if (delta !== 0) {
                    const userInfo = JSON.parse(sessionStorage.getItem('gobang_user') || '{}');
                    if (userInfo.score != null) {
                        userInfo.score = Math.max(0, userInfo.score + delta);
                        sessionStorage.setItem('gobang_user', JSON.stringify(userInfo));
                        score = userInfo.score;
                        elements.score.textContent = `分数: ${score}`;
                    }
                }

                let resultText = '游戏结束';
                if (data.reason === 'giveup') {
                    resultText = delta > 0 ? '对手放弃认输，你获胜了！' : '你已放弃认输';
                } else if (data.reason === 'timeout') {
                    resultText = delta > 0 ? '对手重连超时，你获胜了！' : '重连超时，判负';
                }
                showNotification(`${resultText} (${delta >= 0 ? '+' : ''}${delta}分)`, delta > 0 ? 'success' : 'error');
            }
        };

        function updateConnectionStatus(status) {
            elements.connectionStatus.className = `connection-status ${status}`;

            switch (status) {
                case 'connected':
                    elements.connectionStatus.textContent = '已连接';
                    break;
                case 'disconnected':
                    elements.connectionStatus.textContent = '已断开';
                    break;
                case 'connecting':
                    elements.connectionStatus.textContent = '正在连接...';
                    break;
            }
        }

        let wsClient = null;
        let shouldReconnect = true;

        function initWebSocket() {
            if (wsClient && wsClient.isConnected()) {
                return;
            }

            const wsHost = window.location.hostname || '127.0.0.1';
            wsClient = new GobangWebSocket({
                url: `ws://${wsHost}:8080/ws`,
                token: token,

                onOpen: () => {
                    updateConnectionStatus('connected');
                    wsClient.send('auth', { token: token, source: 'hall' });
                },

                onClose: () => {
                    updateConnectionStatus('disconnected');
                    if (shouldReconnect && currentState !== AppState.MATCHED) {
                        updateConnectionStatus('connecting');
                        wsClient.reconnect();
                    }
                },

                onError: () => {
                    showNotification('连接错误', 'error');
                    updateConnectionStatus('disconnected');
                },

                onEvent: (event, data) => {
                    if (eventHandlers[event]) {
                        eventHandlers[event](data);
                    }
                }
            });

            wsClient.connect();
        }

        elements.matchStartBtn.addEventListener('click', () => {
            if (currentState === AppState.IDLE) {
                if (wsClient.send('match.start', { token: token, score: score })) {
                    // 等待 match.waiting 确认后再切状态
                } else {
                    showNotification('发送失败，请检查连接', 'error');
                }
            }
        });

        elements.matchCancelBtn.addEventListener('click', () => {
            if (currentState === AppState.MATCHING) {
                wsClient.send('match.cancel', { token: token });
            }
        });

        elements.logoutBtn.addEventListener('click', () => {
            shouldReconnect = false;
            sessionStorage.removeItem('gobang_token');
            sessionStorage.removeItem('gobang_user');
            wsClient.close();
            window.location.href = 'login.html';
        });

        let reconnectCountdownTimer = null;
        let reconnectRoomData = null;

        function showReconnectModal(data) {
            reconnectRoomData = data;

            const infoEl = document.getElementById('reconnectInfo');
            const opponentId = data.opponent ? data.opponent.user_id : '未知';
            infoEl.textContent = `对手(ID: ${opponentId})正在等待你重连...`;

            drawBoardPreview(data.board);

            let remaining = data.timeout_remaining || 60;
            const countdownEl = document.getElementById('reconnectCountdown');
            countdownEl.textContent = remaining;

            if (reconnectCountdownTimer) clearInterval(reconnectCountdownTimer);
            reconnectCountdownTimer = setInterval(() => {
                remaining--;
                countdownEl.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(reconnectCountdownTimer);
                    hideReconnectModal();
                    showNotification('重连超时', 'error');
                }
            }, 1000);

            document.getElementById('reconnectModal').classList.remove('hidden');
        }

        function hideReconnectModal() {
            document.getElementById('reconnectModal').classList.add('hidden');
            if (reconnectCountdownTimer) {
                clearInterval(reconnectCountdownTimer);
                reconnectCountdownTimer = null;
            }
            reconnectRoomData = null;
        }

        function drawBoardPreview(boardStr) {
            const canvas = document.getElementById('boardPreview');
            if (!canvas || !boardStr) return;
            const ctx = canvas.getContext('2d');
            const size = 300;
            const boardSize = 15;
            const cellSize = (size - 40) / (boardSize - 1);
            const padding = 20;
            const boardWood = getTokenColor('--color-board-wood', '#c4a35a');
            const boardLine = getTokenColor('--color-board-line', '#5c4a32');

            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = boardWood;
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = boardLine;
            ctx.lineWidth = 1;
            for (let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(padding + (boardSize - 1) * cellSize, padding + i * cellSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, padding + (boardSize - 1) * cellSize);
                ctx.stroke();
            }

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const ch = boardStr.charAt(r * boardSize + c);
                    if (ch === '1' || ch === '2') {
                        const x = padding + c * cellSize;
                        const y = padding + r * cellSize;
                        ctx.beginPath();
                        ctx.arc(x, y, cellSize * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = ch === '1' ? '#000' : '#fff';
                        ctx.fill();
                        ctx.strokeStyle = boardLine;
                        ctx.stroke();
                    }
                }
            }
        }

        document.getElementById('btnReconnectAccept').addEventListener('click', () => {
            if (wsClient) {
                wsClient.send('reconnect.accept', { token: token });
            }
        });

        document.getElementById('btnReconnectReject').addEventListener('click', () => {
            if (confirm('拒绝重连将被判负，确定放弃吗？')) {
                if (wsClient) {
                    wsClient.send('reconnect.reject', { token: token });
                }
                hideReconnectModal();
            }
        });

        window.addEventListener('load', () => {
            if (loadToken()) {
                shouldReconnect = true;
                initWebSocket();
                updateUI(AppState.IDLE);
                if (typeof window.initWallpaperPicker === 'function') {
                    window.initWallpaperPicker();
                }
            }
        });

        window.addEventListener('beforeunload', () => {
            if (wsClient) {
                shouldReconnect = false;
                wsClient.close();
            }
        });
    </script>
</body>
</html>
